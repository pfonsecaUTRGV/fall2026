<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pokemon Team Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  </head>

<body>
  
  <nav class="navbar sm:navbar-expand bg-1 fg-2">
  <div class="container-fluid">
    <a class="navbar-brand" href="{% url 'dashboard' %}">Team Dashboard</a>
    <div class="d-flex gap-2 align-items-center">
      {% if user.is_authenticated %}
          <span> Hi, {{user.name}} </span>
            <a class="btn-outline-light" href="{% url 'dashboard'}">Dashboard</a>
            <form method="POST" action="{% url 'logout' %}"> {% csrf_token %}
              <button class="btn btn-warning"> Logout</button>
            </form>
      {% else %}
        <a class="btn-outline-light" href="{% url 'login' %}">Login</a>
        <a class="btn btn-warning" href="{% url 'register' %}">Register </a>
      {% endif %} 
    </div>
    
      <div class="drawer-body">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">See Tasks</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Add New Taks</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link disabled" aria-disabled="true">Disabled</a>
          </li>
        </ul>
      </div>
    </dialog>
  </div>
</nav>


  <div class="container mt-4">
    {% block content %}
    {% endblock %}
  </div>


</body>
  
</html>

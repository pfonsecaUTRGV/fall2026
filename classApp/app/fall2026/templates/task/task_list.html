{% extends 'task/base.html' %}

{% block content %}

<style>
    .tasks-container {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        margin-top: 20px;
    }

    .task-card {
        background-color: #ffffff;
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 20px;
        width: 250px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .task-card h3 {
        margin-top: 0;
        color: #333;
    }

    .task-card p {
        color: #666;
        margin-bottom: 0;
    }

    .add-task {
        display: inline-block;
        margin-top: 25px;
        padding: 10px 18px;
        background-color: #007bff;
        color: white;
        text-decoration: none;
        border-radius: 5px;
    }

    .add-task:hover {
        background-color: #0056b3;
    }
</style>

<h1>All Tasks</h1>

<div class="tasks-container">

    {% for task in tasks %}

        <div class="task-card">
            <h3>{{ task.title }}</h3>
            <p>{{ task.date|date:"m-d-Y" }}</p>
        </div>

    {% empty %}

        <p>No tasks yet.</p>

    {% endfor %}

</div>

<a href="/tasks/new/" class="add-task">Add New Task</a>

{% endblock %}
